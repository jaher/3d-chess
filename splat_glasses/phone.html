<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f14">
  <title>Splat World — Capture</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0b0f14; color: #e6edf3;
           font: 16px/1.45 system-ui, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 8px 0 2px; }
    .sub { color: #8b98a5; font-size: 13px; margin-bottom: 14px; }
    section { background: #121820; border: 1px solid #1f2a36; border-radius: 12px;
              padding: 14px; margin-bottom: 14px; }
    h2 { font-size: 15px; margin: 0 0 10px; color: #9fdcff; }
    button { background: #1f6feb; color: #fff; border: 0; border-radius: 8px;
             padding: 10px 14px; font-size: 15px; font-weight: 600; }
    button:disabled { opacity: 0.45; }
    button.ghost { background: #21313f; }
    input[type=text] { width: 100%; box-sizing: border-box; background: #0b0f14;
             border: 1px solid #1f2a36; border-radius: 8px; color: #e6edf3;
             padding: 9px 10px; font-size: 15px; margin: 6px 0 10px; }
    #preview { width: 100%; border-radius: 8px; display: none; margin: 8px 0; }
    #status { font-size: 14px; color: #ffd479; min-height: 1.4em; white-space: pre-wrap; }
    .world { display: flex; align-items: center; gap: 10px; padding: 8px 0;
             border-top: 1px solid #1f2a36; }
    .world:first-child { border-top: 0; }
    .world .nm { flex: 1; font-size: 14px; }
    .world button { padding: 7px 10px; font-size: 13px; }
    #live { width: 100%; border-radius: 8px; border: 1px solid #1f2a36; }
    .row { display: flex; gap: 8px; }
  </style>
</head>
<body>
<main>
  <h1>Splat World</h1>
  <div class="sub">Take a photo → Marble generates a Gaussian-splat world →
    the server renders it and streams frames to your glasses.</div>

  <section>
    <h2>1 · Capture a photo</h2>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
    <div class="row">
      <button id="shoot">Take / choose photo</button>
    </div>
    <img id="preview" alt="Photo preview">
    <input id="prompt" type="text" placeholder="Optional text prompt (style, mood…)">
    <input id="name" type="text" placeholder="World name">
    <button id="generate" disabled>Generate world</button>
    <p id="status"></p>
  </section>

  <section>
    <h2>2 · Send a world to the glasses</h2>
    <div id="worlds">loading…</div>
  </section>

  <section>
    <h2>3 · Glasses view (live)</h2>
    <!-- src is set after window load: an MJPEG stream never "finishes", and
         assigning it during parse would hold the page's load event open. -->
    <img id="live" alt="Live stream">
    <div class="row" style="margin-top:8px">
      <button class="ghost" data-nav="left">◀</button>
      <button class="ghost" data-nav="fwd">▲</button>
      <button class="ghost" data-nav="back">▼</button>
      <button class="ghost" data-nav="right">▶</button>
      <button class="ghost" data-nav="reset">⟲</button>
    </div>
  </section>
</main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
let photoB64 = null;

// --- capture: downscale on-device so the base64 upload stays small ---------
$('shoot').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0];
  if (!f) return;
  const img = new Image();
  img.src = URL.createObjectURL(f);
  await img.decode();
  const maxSide = 1600;
  const s = Math.min(1, maxSide / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL('image/jpeg', 0.9);
  photoB64 = dataUrl.split(',')[1];
  $('preview').src = dataUrl; $('preview').style.display = 'block';
  $('generate').disabled = false;
  URL.revokeObjectURL(img.src);
};

// --- generate + poll ---------------------------------------------------------
$('generate').onclick = async () => {
  $('generate').disabled = true;
  $('status').textContent = 'Submitting to Marble…';
  try {
    const r = await fetch('/api/generate', {
      method: 'POST',
      body: JSON.stringify({
        image_base64: photoB64, extension: 'jpg',
        text_prompt: $('prompt').value.trim(),
        display_name: $('name').value.trim() || 'Phone world',
      }),
    });
    const op = await r.json();
    if (!r.ok) throw new Error(JSON.stringify(op).slice(0, 300));
    const opId = op.operation_id || op.id || (op.operation && op.operation.id);
    if (!opId) throw new Error('no operation id in response');
    $('status').textContent = `Generating… (operation ${String(opId).slice(0, 8)}…)`;
    poll(opId);
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
    $('generate').disabled = false;
  }
};

async function poll(opId) {
  try {
    const r = await fetch('/api/operations/' + opId);
    const op = await r.json();
    if (op.done) {
      const world = op.response || op.result || {};
      const spz = world.assets && world.assets.splats && world.assets.splats.spz_urls;
      if (op.error || !spz) {
        $('status').textContent = 'Generation failed: ' + JSON.stringify(op.error || op).slice(0, 300);
      } else {
        $('status').textContent = 'World ready! Sending to glasses…';
        await loadWorld(spz['500k'] || spz['100k'] || spz.full_res,
                        world.display_name || 'New world');
        $('status').textContent = 'Live on glasses ✓';
        listWorlds();
      }
      $('generate').disabled = false;
      return;
    }
    const pct = (op.metadata && (op.metadata.progress_percent ?? op.metadata.progress)) ?? '';
    $('status').textContent = `Generating… ${pct !== '' ? pct + '%' : '(takes a few minutes)'}`;
    setTimeout(() => poll(opId), 5000);
  } catch (e) {
    $('status').textContent = 'Poll error (retrying): ' + e.message;
    setTimeout(() => poll(opId), 8000);
  }
}

// --- existing worlds ---------------------------------------------------------
async function loadWorld(spzUrl, name) {
  const r = await fetch('/api/load', {
    method: 'POST', body: JSON.stringify({ spz_url: spzUrl, name }),
  });
  if (!r.ok) throw new Error('load failed: ' + (await r.text()).slice(0, 200));
  // MJPEG stream restarts with the new world automatically; nudge the <img>.
  $('live').src = '/stream.mjpg?' + Date.now();
}

async function listWorlds() {
  try {
    const r = await fetch('/api/worlds');
    const data = await r.json();
    const div = $('worlds');
    div.innerHTML = '';
    for (const w of (data.worlds || [])) {
      const spz = w.assets && w.assets.splats && w.assets.splats.spz_urls;
      if (!spz) continue;
      const row = document.createElement('div');
      row.className = 'world';
      const nm = document.createElement('span');
      nm.className = 'nm'; nm.textContent = w.display_name || w.world_id;
      const btn = document.createElement('button');
      btn.textContent = 'Send to glasses';
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = 'Loading…';
        try { await loadWorld(spz['500k'] || spz['100k'] || spz.full_res, w.display_name); btn.textContent = 'Live ✓'; }
        catch (e) { btn.textContent = 'Failed'; }
        setTimeout(() => { btn.disabled = false; btn.textContent = 'Send to glasses'; }, 3000);
      };
      row.append(nm, btn); div.append(row);
    }
    if (!div.children.length) div.textContent = 'No generated worlds yet.';
  } catch (e) { $('worlds').textContent = 'Could not list worlds: ' + e.message; }
}
listWorlds();

window.addEventListener('load', () => { $('live').src = '/stream.mjpg?' + Date.now(); });

// --- phone nav buttons (debug / demo without glasses) -------------------------
for (const b of document.querySelectorAll('[data-nav]')) {
  b.onclick = () => fetch('/api/nav', { method: 'POST', body: JSON.stringify({ action: b.dataset.nav }) });
}
</script>
</body>
</html>
